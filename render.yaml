databases:
  - name: cart-db
    databaseName: cart
    user: cart

services:
  - type: web
    name: smart-cart-delivery
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: admin
      - key: ADMIN_PASSWORD   # Renderの画面で8文字以上を設定してください
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
